<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计数据</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ffeef8 0%, #fff5f0 100%);
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      color: #ff6b9d;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.2);
      text-align: center;
    }

    .stat-card .label {
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: bold;
      color: #ff6b9d;
    }

    .chart-container {
      background: white;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.2);
      margin-bottom: 20px;
    }

    .chart-title {
      font-size: 18px;
      font-weight: bold;
      color: #ff6b9d;
      margin-bottom: 15px;
    }

    canvas {
      max-height: 300px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 统计数据</h1>
  </div>

  <div class="stats-summary">
    <div class="stat-card">
      <div class="label">今日完成</div>
      <div class="value" id="todayCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">本周完成</div>
      <div class="value" id="weekCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">总计完成</div>
      <div class="value" id="totalCount">0</div>
    </div>
    <div class="stat-card">
      <div class="label">总工作时长</div>
      <div class="value" id="totalHours">0h</div>
    </div>
  </div>

  <div class="chart-container">
    <div class="chart-title">最近7天完成情况</div>
    <canvas id="weekChart"></canvas>
  </div>

  <div class="chart-container">
    <div class="chart-title">工作时长分布</div>
    <canvas id="durationChart"></canvas>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="stats.js"></script>
</body>
</html>
